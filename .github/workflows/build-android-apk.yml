name: Build Subway Pilot APK
on:
  push:
    branches: [android-subway-pilot]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK directory: $SDK_HOME"
          ls "$SDK_HOME" || true
          SDKMGR="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0' || true
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: subway-pilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
